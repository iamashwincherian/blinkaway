<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline'">
<title>Break</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    display: grid; place-items: center; color: #f6f2e6; cursor: default; user-select: none;
    -webkit-font-smoothing: antialiased;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
    background: var(--bg) center / cover no-repeat, #17150f;
    opacity: 0; transition: opacity .4s ease;
  }
  body.in { opacity: 1; }
  main { position: relative; text-align: center; padding: 24px; max-width: 760px; }
  .ghost { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; margin-bottom: 36px; }
  .orb {
    position: absolute; left: 50%; top: 50%; width: 560px; height: 560px; margin: -280px 0 0 -280px;
    border-radius: 50%; background: radial-gradient(circle, rgba(255,206,58,.16), transparent 68%);
    animation: breathe 8s ease-in-out infinite; pointer-events: none; transition: opacity .8s;
  }
  @keyframes breathe { 0%, 100% { transform: scale(.72); opacity: .55; } 50% { transform: scale(1.12); opacity: 1; } }
  .ghost svg { position: relative; width: 168px; height: 168px; animation: float 2.4s ease-in-out infinite; }
  .shadow { width: 76px; height: 12px; margin-top: 4px; border-radius: 50%; background: rgba(0,0,0,.45); animation: shadow 2.4s ease-in-out infinite; }
  @keyframes float { 50% { transform: translateY(-10px); } }
  @keyframes shadow { 50% { transform: scale(.8); opacity: .7; } }
  .eye { transform-box: fill-box; transform-origin: center; animation: blink 2.8s ease-in-out infinite; }
  @keyframes blink { 0%, 88%, 100% { transform: scaleY(1); } 93% { transform: scaleY(.1); } }

  /* The ghost's mood: how far it leans, how it floats, which eyes it wears */
  .lean { transform: rotate(12deg); transform-origin: 50px 50px; transition: transform .8s cubic-bezier(.3, 1.4, .5, 1); }
  [data-mood=happy] .lean { transform: rotate(6deg); }
  [data-mood=tired] .lean { transform: rotate(17deg); }
  [data-mood=sad] .lean { transform: rotate(22deg); }
  [data-mood=happy] .ghost svg, [data-mood=happy] .shadow { animation-duration: 1.5s; }
  [data-mood=tired] .ghost svg, [data-mood=tired] .shadow, [data-mood=sad] .ghost svg, [data-mood=sad] .shadow { animation-duration: 3.6s; }
  .face { display: none; }
  [data-face=calm] .face-calm, [data-face=happy] .face-happy, [data-face=tired] .face-tired,
  [data-face=sad] .face-sad, [data-face=closed] .face-closed { display: inline; }

  /* Guided exercises (primary display only) */
  .ex-follow .ghost { animation: wander 9s ease-in-out infinite; }
  @keyframes wander {
    0%, 100% { transform: translate(0, 0); }
    20% { transform: translate(-34vw, -6vh); }
    40% { transform: translate(-10vw, -18vh); }
    60% { transform: translate(34vw, -6vh); }
    80% { transform: translate(10vw, -18vh); }
  }
  .ex-blink .eye { animation: slowblink 3.2s ease-in-out infinite; }
  @keyframes slowblink { 0%, 35%, 85%, 100% { transform: scaleY(1); } 45%, 70% { transform: scaleY(.08); } }
  .ex-palm .orb { opacity: .25; }

  /* Entrance: content rises in, one beat after another */
  main > * { animation: rise .7s cubic-bezier(.2, .8, .25, 1) backwards; /* backwards: must not pin opacity once .done fades things out */ }
  main > :nth-child(2) { animation-delay: .08s; } main > :nth-child(3) { animation-delay: .12s; }
  main > :nth-child(4) { animation-delay: .16s; } main > :nth-child(5) { animation-delay: .22s; }
  main > :nth-child(6) { animation-delay: .26s; } main > :nth-child(7) { animation-delay: .32s; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } }
  .tag { font-size: 13px; font-weight: 600; letter-spacing: .22em; text-transform: uppercase; color: #ffce3a; }
  .guilt { margin: 10px 0 0; font-size: 15px; color: #ffce3a; opacity: .85; }
  h1 { font-size: clamp(28px, 4.2vw, 46px); font-weight: 600; line-height: 1.2; letter-spacing: -.02em; margin: 16px 0 26px; text-wrap: balance; }
  .time { font-size: clamp(36px, 4vw, 48px); font-weight: 200; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  .bar { width: min(340px, 70vw); height: 4px; margin: 24px auto 36px; border-radius: 2px; background: rgba(255,255,255,.12); overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: inherit; background: #ffce3a; box-shadow: 0 0 12px rgba(255,206,58,.6); transition: width 1s linear; }
  button {
    font: inherit; font-size: 14px; color: #f6f2e6; padding: 9px 20px; border-radius: 999px; cursor: pointer;
    background: rgba(255,255,255,.1); border: .5px solid rgba(255,255,255,.2); transition: background .2s, transform .1s;
    -webkit-backdrop-filter: blur(20px) saturate(1.6); backdrop-filter: blur(20px) saturate(1.6);
    box-shadow: inset 0 1px rgba(255,255,255,.08), 0 4px 16px rgba(0,0,0,.18);
  }
  button:hover:enabled { background: rgba(255,255,255,.18); }
  button:active:enabled { transform: scale(.97); }
  button:disabled { cursor: default; opacity: .5; font-variant-numeric: tabular-nums; }
  button:focus-visible { outline: 3px solid rgba(255,206,58,.6); outline-offset: 2px; }
  kbd { font: inherit; opacity: .55; margin-left: 6px; }
  .actions { display: flex; justify-content: center; gap: 10px; }
  .lock { position: fixed; left: 0; right: 0; bottom: 32px; width: max-content; margin: 0 auto; display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 8px 16px; }
  .lock svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }

  /* Done: the ghost straightens up, happy, and stops exercising */
  .done .lean { transform: none; }
  .done .ghost { animation: none; }
  .done .ghost svg { animation: float 2.4s ease-in-out infinite; }
  .done .guilt, .done .time, .done .bar, .done button { opacity: 0; transition: opacity .4s; }
  .preview.done button { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { main > * { animation: none; } }
</style>
</head>
<body>
<main>
  <div class="ghost">
    <div class="orb"></div>
    <svg viewBox="0 0 100 100"><g class="lean">
      <rect x="31" y="14" width="38" height="72" rx="19" fill="#ffce3a"/>
      <g fill="#1d1b16">
        <g class="face face-calm"><ellipse class="eye" cx="44" cy="34" rx="3.8" ry="6"/><ellipse class="eye" cx="57" cy="34" rx="3.8" ry="6"/></g>
        <g class="face face-tired"><ellipse class="eye" cx="44" cy="36" rx="3.8" ry="2.4"/><ellipse class="eye" cx="57" cy="36" rx="3.8" ry="2.4"/></g>
        <g class="face face-sad"><ellipse class="eye" cx="44" cy="40" rx="3.6" ry="5"/><ellipse class="eye" cx="57" cy="40" rx="3.6" ry="5"/></g>
      </g>
      <g fill="none" stroke="#1d1b16" stroke-linecap="round">
        <path class="face face-happy" d="M40 36 Q44 29 48 36 M53 36 Q57 29 61 36" stroke-width="3.5"/>
        <path class="face face-closed" d="M40 35 H48 M53 35 H61" stroke-width="4"/>
      </g>
    </g></svg>
    <div class="shadow"></div>
  </div>
  <div class="tag" id="tag"></div>
  <p class="guilt" id="guilt" hidden></p>
  <h1 id="msg"></h1>
  <div class="time" id="time"></div>
  <div class="bar"><i id="bar"></i></div>
  <div class="actions" id="actions" hidden>
    <button data-mins="1">+1 min</button>
    <button data-mins="5">+5 min</button>
    <button id="skip">Skip break<kbd>Esc</kbd></button>
  </div>
</main>
<button class="lock" id="lock" hidden><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>Lock screen</button>
<script>
  const q = new URLSearchParams(location.search)
  const d = JSON.parse(q.get('d'))
  const primary = q.get('primary') === '1'
  const BG = {
    honey: 'radial-gradient(ellipse at 50% 40%, #33290f, #17150f 62%)',
    dusk: 'linear-gradient(160deg, #0f0c29, #302b63 55%, #6d3a7c)',
    ocean: 'linear-gradient(160deg, #021b2e, #0b4f6c 55%, #1f8a8a)',
    forest: 'linear-gradient(160deg, #07170f, #1d4d33 55%, #587a3d)',
    ember: 'linear-gradient(160deg, #1a0b0b, #6b1f2a 55%, #c2593f)',
    night: 'linear-gradient(160deg, #050507, #16161d)',
  }
  // Guided eye exercises. Other displays just show the plain break.
  const EX = {
    follow: ['Follow the ghost', 'Keep your head still and follow the ghost with your eyes.'],
    blink: ['Blink along', 'Slow, full blinks. Close gently, hold a moment, open.'],
    palm: ['Palming', 'Rub your palms warm, then cup them over your closed eyes. We’ll chime when it’s over.'],
  }
  const ex = primary && EX[d.exercise]
  document.body.style.setProperty('--bg', BG[d.background] || BG.honey)
  document.body.dataset.mood = d.mood || 'calm'
  document.body.dataset.face = d.exercise === 'palm' && primary ? 'closed' : d.mood || 'calm'
  if (ex) document.body.classList.add(`ex-${d.exercise}`)

  const $ = id => document.getElementById(id)
  $('tag').textContent = d.planned || (ex ? ex[0] : d.long ? 'Long break' : 'Eye break')
  $('msg').textContent = ex ? ex[1] : d.msg
  $('guilt').textContent = d.guilt
  $('guilt').hidden = !d.guilt
  $('actions').hidden = !d.allowSkip && !d.preview
  // Postpone buttons work from the first second; a preview only offers Close.
  document.querySelectorAll('[data-mins]').forEach(b => {
    b.hidden = d.preview
    b.onclick = () => api.send('action', { type: 'snooze', mins: +b.dataset.mins })
  })
  // Skip unlocks after 5 s so a break can't be dismissed by reflex. A preview closes right away.
  let lock = d.preview ? 0 : 5
  const trySkip = () => d.preview ? api.send('action', { type: 'close-preview' })
    : d.allowSkip && !lock && api.send('action', { type: 'skip' })
  const label = () => {
    $('skip').disabled = lock > 0
    $('skip').innerHTML = d.preview ? 'Close preview<kbd>Esc</kbd>'
      : lock ? `Skip break in ${lock}` : 'Skip break<kbd>Esc</kbd>'
  }
  label()
  const unlock = lock && setInterval(() => { if (--lock === 0) clearInterval(unlock); label() }, 1000)
  $('skip').onclick = trySkip
  // Lock the computer and walk away; the break keeps running underneath.
  $('lock').hidden = !primary || d.preview
  $('lock').onclick = () => api.send('action', { type: 'lock' })
  addEventListener('keydown', e => e.key === 'Escape' && trySkip())

  function chime(notes) {
    if (!d.sound || !primary) return
    const ac = new AudioContext()
    notes.forEach((f, i) => {
      const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + i * 0.16
      o.frequency.value = f
      g.gain.setValueAtTime(0, t)
      g.gain.linearRampToValueAtTime(0.18, t + 0.02)
      g.gain.exponentialRampToValueAtTime(0.0001, t + 1.4)
      o.connect(g).connect(ac.destination)
      o.start(t); o.stop(t + 1.5)
    })
  }

  function show(t) {
    $('time').textContent = `${Math.floor(t / 60)}:${String(t % 60).padStart(2, '0')}`
    $('bar').style.width = `${(t / d.total) * 100}%`
    if (t > 0) return
    document.body.classList.add('done')
    document.body.dataset.face = 'happy'
    $('tag').textContent = 'Break complete'
    $('msg').textContent = 'Welcome back. Your eyes feel better already.'
    chime([523.25, 659.25, 783.99])
  }

  show(d.total)
  if (d.preview) {
    document.body.classList.add('preview')
    let t = d.total
    const run = setInterval(() => { show(--t); if (!t) clearInterval(run) }, 1000)
  } else api.on('tick', show)
  requestAnimationFrame(() => document.body.classList.add('in'))
  api.on('fade', () => document.body.classList.remove('in'))
  chime([783.99, 659.25])
</script>
</body>
</html>
