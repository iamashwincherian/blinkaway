<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline'; img-src * data: file:">
<title>Break</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    display: grid; place-items: center; color: #fff; cursor: default; user-select: none;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
    background: var(--bg) center / cover no-repeat, #0b0b10;
    opacity: 0; transition: opacity .9s ease;
  }
  body.in { opacity: 1; }
  main { position: relative; text-align: center; padding: 24px; max-width: 760px; }
  .orb {
    position: absolute; left: 50%; top: 50%; width: 420px; height: 420px; margin: -210px 0 0 -210px;
    border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,.14), transparent 68%);
    animation: breathe 8s ease-in-out infinite; pointer-events: none;
  }
  @keyframes breathe { 0%, 100% { transform: scale(.72); opacity: .55; } 50% { transform: scale(1.12); opacity: 1; } }
  .tag { font-size: 13px; font-weight: 600; letter-spacing: .22em; text-transform: uppercase; opacity: .65; }
  h1 { font-size: clamp(28px, 4.2vw, 46px); font-weight: 600; line-height: 1.2; margin: 18px 0 30px; text-wrap: balance; }
  .time { font-size: clamp(64px, 9vw, 104px); font-weight: 200; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  .bar { width: min(340px, 70vw); height: 4px; margin: 26px auto 40px; border-radius: 2px; background: rgba(255,255,255,.18); overflow: hidden; }
  .bar i { display: block; height: 100%; background: #fff; transition: width 1s linear; }
  button {
    font: inherit; font-size: 14px; color: #fff; padding: 9px 20px; border-radius: 999px; cursor: pointer;
    background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.22); transition: background .2s;
  }
  button:hover { background: rgba(255,255,255,.22); }
  button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  kbd { font: inherit; opacity: .55; margin-left: 6px; }
  .done .time, .done .bar, .done button { opacity: 0; transition: opacity .4s; }
</style>
</head>
<body>
<main>
  <div class="orb"></div>
  <div class="tag" id="tag"></div>
  <h1 id="msg"></h1>
  <div class="time" id="time"></div>
  <div class="bar"><i id="bar"></i></div>
  <button id="skip" hidden>Skip break<kbd>Esc</kbd></button>
</main>
<script>
  const q = new URLSearchParams(location.search)
  const d = JSON.parse(q.get('d'))
  const primary = q.get('primary') === '1'
  const BG = {
    dusk: 'linear-gradient(160deg, #0f0c29, #302b63 55%, #6d3a7c)',
    ocean: 'linear-gradient(160deg, #021b2e, #0b4f6c 55%, #1f8a8a)',
    forest: 'linear-gradient(160deg, #07170f, #1d4d33 55%, #587a3d)',
    ember: 'linear-gradient(160deg, #1a0b0b, #6b1f2a 55%, #c2593f)',
    night: 'linear-gradient(160deg, #050507, #16161d)',
  }
  document.body.style.setProperty('--bg', d.bgUrl
    ? `linear-gradient(rgba(0,0,0,.4), rgba(0,0,0,.4)), url(${JSON.stringify(d.bgUrl)})`
    : BG[d.background] || BG.dusk)

  const $ = id => document.getElementById(id)
  $('tag').textContent = d.long ? 'Long break' : 'Eye break'
  $('msg').textContent = d.msg
  $('skip').hidden = !d.allowSkip
  $('skip').onclick = () => api.send('action', { type: 'skip' })
  addEventListener('keydown', e => e.key === 'Escape' && d.allowSkip && api.send('action', { type: 'skip' }))

  function chime(notes) {
    if (!d.sound || !primary) return
    const ac = new AudioContext()
    notes.forEach((f, i) => {
      const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + i * 0.16
      o.frequency.value = f
      g.gain.setValueAtTime(0, t)
      g.gain.linearRampToValueAtTime(0.18, t + 0.02)
      g.gain.exponentialRampToValueAtTime(0.0001, t + 1.4)
      o.connect(g).connect(ac.destination)
      o.start(t); o.stop(t + 1.5)
    })
  }

  function show(t) {
    $('time').textContent = `${Math.floor(t / 60)}:${String(t % 60).padStart(2, '0')}`
    $('bar').style.width = `${(t / d.total) * 100}%`
    if (t > 0) return
    document.body.classList.add('done')
    $('tag').textContent = 'Break complete'
    $('msg').textContent = 'Welcome back. Your eyes feel better already.'
    chime([523.25, 659.25, 783.99])
  }

  show(d.total)
  api.on('tick', show)
  requestAnimationFrame(() => document.body.classList.add('in'))
  chime([783.99, 659.25])
</script>
</body>
</html>
