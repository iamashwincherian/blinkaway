<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline'">
<title>Distant</title>
<style>
  :root {
    color-scheme: light dark;
    --card: rgba(252, 250, 244, .97); --text: #1d1b16; --muted: #6b665a; --line: rgba(29,27,22,.08);
    --btn: rgba(29,27,22,.06); --btn-hover: rgba(29,27,22,.11); --num: #8a6400;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --card: rgba(36, 33, 27, .97); --text: #f6f2e6; --muted: #b4ad9b; --line: rgba(255,255,255,.09);
      --btn: rgba(255,255,255,.08); --btn-hover: rgba(255,255,255,.15); --num: #ffce3a;
    }
  }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body {
    padding: 12px; box-sizing: border-box; cursor: default; user-select: none; color: var(--text);
    font: 13px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    height: 100%; box-sizing: border-box; padding: 14px; border-radius: 18px;
    background: var(--card); border: .5px solid var(--line);
    box-shadow: 0 0 0 .5px rgba(0,0,0,.06), 0 2px 4px rgba(0,0,0,.08), 0 6px 12px rgba(0,0,0,.1);
    animation: in .5s cubic-bezier(.2, .9, .25, 1.15) both;
  }
  @keyframes in { from { opacity: 0; transform: translateX(24px) scale(.96); } }
  .row { display: flex; gap: 12px; align-items: center; }
  .row > div { min-width: 0; }
  b { display: block; font-size: 13.5px; font-weight: 600; letter-spacing: -.01em; }
  .num { font-variant-numeric: tabular-nums; color: var(--num); }
  small { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; text-wrap: pretty; }
  .btns { display: flex; gap: 6px; margin-top: 12px; }
  button {
    flex: 1; font: inherit; font-size: 12px; font-weight: 500; color: var(--text); height: 28px; border-radius: 999px; cursor: pointer;
    background: var(--btn); border: 0; transition: background .15s, transform .1s;
  }
  button:hover { background: var(--btn-hover); }
  button:active { transform: scale(.97); }
  button.primary { flex: 1.6; color: #1d1b16; font-weight: 600; background: #ffce3a; }
  button.primary:hover { background: #ffd65c; }
  button:focus-visible { outline: 3px solid rgba(255,206,58,.55); outline-offset: 1px; }

  /* Ghost sits in a soft halo */
  .avatar { position: relative; flex: none; width: 48px; height: 48px; border-radius: 50%; background: rgba(255,206,58,.16); }
  .avatar svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .lid { transform-box: fill-box; transform-origin: center; animation: blink 2s ease-in-out infinite; }
  @keyframes blink { 0%, 40%, 60%, 100% { transform: scaleY(1); } 50% { transform: scaleY(.1); } }
  .spine { transform-origin: 50px 86px; animation: straighten 2.4s ease-in-out infinite; }
  @keyframes straighten { 0%, 100% { transform: rotate(12deg); } 45%, 75% { transform: rotate(0); } }
  @media (prefers-reduced-motion: reduce) { *, *::before { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="card" id="card"></div>
<script>
  const q = new URLSearchParams(location.search)
  const card = document.getElementById('card')
  const kind = q.get('kind')

  // The ghost with a given face and lean; faces match break.html.
  const FACES = {
    calm: '<g fill="#1d1b16"><ellipse cx="44" cy="34" rx="3.8" ry="6"/><ellipse cx="57" cy="34" rx="3.8" ry="6"/></g>',
    tired: '<g fill="#1d1b16"><ellipse cx="44" cy="36" rx="3.8" ry="2.4"/><ellipse cx="57" cy="36" rx="3.8" ry="2.4"/></g>',
    sad: '<g fill="#1d1b16"><ellipse cx="44" cy="40" rx="3.6" ry="5"/><ellipse cx="57" cy="40" rx="3.6" ry="5"/></g>',
    happy: '<path d="M40 36 Q44 29 48 36 M53 36 Q57 29 61 36" fill="none" stroke="#1d1b16" stroke-width="3.5" stroke-linecap="round"/>',
    blink: '<g fill="#1d1b16"><ellipse class="lid" cx="44" cy="34" rx="3.8" ry="6"/><ellipse class="lid" cx="57" cy="34" rx="3.8" ry="6"/></g>',
    away: '<g fill="#1d1b16"><ellipse cx="49" cy="34" rx="3.8" ry="6"/><ellipse cx="62" cy="34" rx="3.8" ry="6"/></g>',
  }
  const LEAN = { calm: 12, happy: 6, tired: 17, sad: 22 }
  const ghost = (face, lean = 12, cls = '') =>
    `<svg viewBox="0 0 100 100"><g class="${cls}" transform="rotate(${lean} 50 50)"><rect x="31" y="14" width="38" height="72" rx="19" fill="#ffce3a"/>${FACES[face]}</g></svg>`
  const row = (svg, title) => `<div class="row"><div class="avatar">${svg}</div><div><b>${title}</b><small id="sub"></small></div></div>`
  const sub = text => { document.getElementById('sub').textContent = text } // messages may carry OS app names

  if (kind === 'headsup') {
    const mood = FACES[q.get('mood')] ? q.get('mood') : 'calm'
    card.innerHTML = row(ghost(mood, LEAN[mood]), 'Break in <span class="num" id="num"></span>') + `
      <div class="btns">
        <button class="primary" data-type="start">Start now</button>
        <button data-type="snooze" data-mins="1">+1 min</button>
        <button data-type="snooze" data-mins="5">+5 min</button>
        ${q.get('allowSkip') ? '<button data-type="skip">Skip</button>' : ''}
      </div>`
    sub(q.get('msg') || 'Wrap up your thought — time to rest your eyes.') // mood line: guilt or praise
    const show = t => { document.getElementById('num').textContent = `${t}s` }
    show(+q.get('left'))
    api.on('tick', show)
    card.onclick = e => {
      const b = e.target.closest('button')
      if (b) api.send('action', { type: b.dataset.type, mins: +b.dataset.mins })
    }
  } else if (kind === 'blink') {
    card.innerHTML = row(ghost('blink'), 'Blink')
    sub('Close your eyes slowly a few times. Screens make us forget.')
  } else if (kind === 'posture') {
    card.innerHTML = row(ghost('calm', 0, 'spine'), 'Check your posture') // CSS animation drives the lean
    sub('Sit back, drop your shoulders, screen at eye level.')
  } else { // hold / resume: the ghost looks away while a call runs, then back at you
    const hold = kind === 'hold'
    card.innerHTML = row(hold ? ghost('away') : ghost('calm', 0), hold ? 'Breaks on hold' : 'Breaks are back on')
    sub(q.get('msg'))
  }
</script>
</body>
</html>
